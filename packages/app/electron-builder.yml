appId: com.xxx
productName: electron-app
electronVersion: 42.2.0
directories:
  buildResources: build
files:
  - './out/**'
  - '!**/*.{map,md,log,txt,lock}' # 排除常用文档、日志和依赖锁文件
  - '!**/test{s,}/**' # 排除所有 test 和 tests 目录
  - '!**/node_modules/electron/**'
asarUnpack:
  - 'resources/**' # 你自定义的二进制资源
  - 'node_modules/**/*.node'

win:
  executableName: electron-app
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSAudioCaptureUsageDescription: Application requests access to system audio for screen recording.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSAccessibilityUsageDescription: Application requests Accessibility access to detect the focused text field and insert dictated text.
  extraResources:
    - from: resources/fn-listener
      to: fn-listener
    - from: resources/focus-check
      to: focus-check
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
