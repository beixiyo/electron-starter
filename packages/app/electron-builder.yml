appId: com.beixiyo.electronstarter
productName: electron-app
electronVersion: 43.1.1
protocols:
  - name: Electron App
    schemes:
      - xxx
# 更新日志：打包时把该文件内容嵌入 latest*.yml，electron-updater 读作 UpdateInfo.releaseNotes，
# 渲染端更新弹窗据此展示「更新内容」。每次发版前更新；文件为空则弹窗自动隐藏该区块
releaseInfo:
  releaseNotesFile: build/release-notes.md
directories:
  buildResources: build
files:
  - './out/**'
  - '!**/*.{map,md,log,txt,lock}' # 排除常用文档、日志和依赖锁文件
  - '!**/test{s,}/**' # 排除所有 test 和 tests 目录
  - '!**/node_modules/electron/**'
asarUnpack:
  - 'resources/**' # 你自定义的二进制资源
  - 'node_modules/**/*.node'

win:
  executableName: electron-app
  # 安装包签名后，electron-updater 会用 publisherName 校验下载包的 Authenticode 证书
  # 用了代码签名证书时需设为证书的 CN，否则正版签名包也可能被拒：
  # publisherName: "Your Company, Inc."
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # 不在模板里写 identity，避免把公司证书名提交到仓库
  # 正式发布时用 CSC_NAME 指定证书名；不设置时 electron-builder 会从钥匙串自动寻找可用身份
  entitlements: build/entitlements.mac.plist
  # Helper / Framework 子进程继承主 app 的签名权限
  entitlementsInherit: build/entitlements.mac.plist
  # Apple 公证要求启用 hardened runtime
  hardenedRuntime: true
  # extraResources 里的 Mach-O helper 需要显式签名
  binaries:
    - Contents/Resources/native/mac/fn-listener
    - Contents/Resources/native/mac/focus-check
    - Contents/Resources/native/mac/hour-cycle
    - Contents/Resources/native/mac/audio-monitor
    - Contents/Resources/native/mac/audio-recorder
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSAudioCaptureUsageDescription: Application requests access to system audio for screen recording.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSAccessibilityUsageDescription: Application requests Accessibility access to detect the focused text field and insert dictated text.
  extraResources:
    - from: resources/native/mac/fn-listener
      to: native/mac/fn-listener
    - from: resources/native/mac/focus-check
      to: native/mac/focus-check
    - from: resources/native/mac/hour-cycle
      to: native/mac/hour-cycle
    - from: resources/native/mac/audio-monitor
      to: native/mac/audio-monitor
    - from: resources/native/mac/audio-recorder
      to: native/mac/audio-recorder
    - from: resources/native/mac/RecorderAPM-LICENSES
      to: native/mac/RecorderAPM-LICENSES
  # 正式分发默认使用 electron-builder 内置公证
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # 自动更新支持差异：AppImage 支持增量自动更新；deb 仅全量自动更新（且需运行时有 dpkg/apt）；
  # snap 不走 electron-updater，由 snap store 自行刷新——别把 snap 包传到上面的 publish 服务器
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# ── 自动更新发布配置 ───────────────────────────────────────────────
# 只要存在 publish 配置，构建时就会在 dist/ 生成 latest*.yml 与 .blockmap（增量下载所需）
# generic provider 不会自动上传，需把 dist/ 下「安装包 + latest*.yml + .blockmap」一并传到 url
# 要求：托管服务器必须支持 HTTP Range（响应 Accept-Ranges: bytes），否则增量下载回退为全量
# 详见 docs/update/。下面是兜底默认值；打包时若 env 设了 UPDATE_PUBLISH_URL
# 或 GCS_PUBLIC_BASE_URL，build-for.mjs 会用 `-c.publish.url` 覆盖它注入安装包，
# 不必手改这里（推荐用 env，避免把地址写死/写错进仓库）
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
