appId: com.flowtica.electronstarter
productName: electron-app
electronVersion: 42.2.0
directories:
  buildResources: build
files:
  - './out/**'
  - '!**/*.{map,md,log,txt,lock}' # 排除常用文档、日志和依赖锁文件
  - '!**/test{s,}/**' # 排除所有 test 和 tests 目录
  - '!**/node_modules/electron/**'
asarUnpack:
  - 'resources/**' # 你自定义的二进制资源
  - 'node_modules/**/*.node'

win:
  executableName: electron-app
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # 不在模板里写 identity，避免把公司证书名提交到仓库
  # 正式发布时用 CSC_NAME 指定证书名；不设置时 electron-builder 会从钥匙串自动寻找可用身份
  entitlements: build/entitlements.mac.plist
  # Helper / Framework 子进程继承主 app 的签名权限
  entitlementsInherit: build/entitlements.mac.plist
  # Apple 公证要求启用 hardened runtime
  hardenedRuntime: true
  # extraResources 里的 Mach-O helper 需要显式签名
  binaries:
    - Contents/Resources/fn-listener
    - Contents/Resources/focus-check
    - Contents/Resources/audio-monitor
    - Contents/Resources/audio-recorder
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSAudioCaptureUsageDescription: Application requests access to system audio for screen recording.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSAccessibilityUsageDescription: Application requests Accessibility access to detect the focused text field and insert dictated text.
  extraResources:
    - from: resources/fn-listener
      to: fn-listener
    - from: resources/focus-check
      to: focus-check
    - from: resources/audio-monitor
      to: audio-monitor
    - from: resources/audio-recorder
      to: audio-recorder
  # 正式分发默认使用 electron-builder 内置公证
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
